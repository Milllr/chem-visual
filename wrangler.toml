name = "chem-journal"
pages_build_output_dir = ".svelte-kit/cloudflare"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "chem-journal"
database_id = "71544cdb-8aa1-4bce-a79d-7c4cbdcb5cf2" # Replace after `wrangler d1 create chem-journal`

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "chem-journal-uploads"
