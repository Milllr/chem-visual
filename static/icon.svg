<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <rect width="512" height="512" rx="96" fill="#F5F5EC"/>
  <g transform="translate(56, 110) scale(3.3)" stroke="#5C6B5C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Benzene ring -->
    <path d="M28,14 L40,21 L40,35 L28,42 L16,35 L16,21 Z" />

    <!-- Double bonds (Kekulé) -->
    <line x1="27" y1="17.5" x2="37" y2="23" />
    <line x1="37" y1="33.5" x2="27" y2="39.5" />
    <line x1="18.5" y1="33" x2="18.5" y2="23" />

    <!-- Chain: ring to C2 -->
    <line x1="40" y1="35" x2="53" y2="26" />
    <!-- C2 to C3 -->
    <line x1="53" y1="26" x2="66" y2="35" />

    <!-- Methyl branch down from C3 -->
    <line x1="66" y1="35" x2="66" y2="48" />

    <!-- C3 to N -->
    <line x1="66" y1="35" x2="79" y2="26" />

    <!-- N to terminal CH3 -->
    <line x1="92" y1="26" x2="105" y2="35" />

    <!-- NH label -->
    <text x="80" y="30" font-size="10" fill="#5C6B5C" stroke="none" font-family="Georgia, 'Times New Roman', serif" font-style="italic">NH</text>
  </g>
</svg>
